# Netlify build configuration for RMAP's Next.js frontend (see DEPLOYMENT.md
# for the full step-by-step). The repo root is not the Next.js project -
# frontend/ is - so `base` points Netlify's build there.
#
# publish = ".next" and the explicit [[plugins]] entry below are both
# required together - confirmed against a real deploy of this repo, not
# just Netlify's general docs. Without them (an earlier version of this
# file left both unset, relying on zero-config auto-detect), Site
# configuration showed "Runtime: Not set" / "Publish directory: Not set":
# `next build` (the plain Next.js CLI) still ran and reported success, but
# with no Runtime and nothing published, every route 404s - there's no
# server/functions layer translating `.next/`'s build output into servable
# routes. `publish = ".next"` tells Netlify where that build output lives
# (relative to `base`); the Next.js Runtime plugin then picks it up and
# turns it into Netlify Functions/Edge Functions + static assets. The
# plugin does NOT go in package.json - Netlify's build image installs it
# itself, and Netlify's own docs discourage also listing it in
# package.json (it can pin a version out of step with what the build image
# expects).
#
# `output: "standalone"` is NOT set for this build path - that mode is only
# for infra/cloud/Dockerfile.frontend's separate, Fly/Docker-only build;
# frontend/next.config.mjs only turns it on when NEXT_OUTPUT_STANDALONE=true,
# which this Netlify build never sets, so `next build` here produces the
# normal (non-standalone) output the Next.js Runtime plugin expects to find
# at `publish`.
#
# NEXT_PUBLIC_API_URL (the deployed backend's URL, e.g.
# https://rmap-backend.fly.dev) is deliberately NOT set here - Next.js bakes
# NEXT_PUBLIC_* variables into the client bundle at build time, so it must be
# a real per-environment value, not a value committed to the repo. Set it in
# the Netlify UI instead: Site configuration -> Environment variables.
#
# Not deployed/validated against a real Netlify account from the sandbox
# that authored this file (no Netlify account/CLI token there) - the
# publish/[[plugins]] settings above were confirmed against a real user's
# actual Netlify deploy (a live 404-after-successful-build was root-caused
# and fixed against their Site configuration screen), not guessed.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
