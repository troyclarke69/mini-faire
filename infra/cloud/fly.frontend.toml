# Fly.io deployment manifest for the Next.js frontend (see fly.toml's header
# for why this is a separate file - one Fly app per manifest). Deploy with
# `fly deploy --config infra/cloud/fly.frontend.toml --dockerfile
# infra/cloud/Dockerfile.frontend --build-arg
# NEXT_PUBLIC_API_URL=https://rmap-backend.fly.dev`.
#
# This file is an alternative to the frontend deploy path DEPLOYMENT.md
# actually walks through (Netlify) - keep it around for anyone who'd rather
# run both frontend and backend on Fly, but it isn't part of that guide.

app = "rmap-frontend"
primary_region = "iad"

[build]
  dockerfile = "infra/cloud/Dockerfile.frontend"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
