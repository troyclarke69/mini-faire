# Fly.io deployment manifest for the Next.js frontend (see fly.toml's header
# for why this is a separate file - one Fly app per manifest, and for why
# [build] below uses a bare filename rather than "infra/cloud/Dockerfile.
# frontend"). Deploy with `fly deploy --config infra/cloud/fly.frontend.toml
# --build-arg NEXT_PUBLIC_API_URL=https://rmap-backend.fly.dev` from the
# repo root - no --dockerfile flag needed, [build] below already declares it.
#
# This file is an alternative to the frontend deploy path DEPLOYMENT.md
# actually walks through (Netlify) - keep it around for anyone who'd rather
# run both frontend and backend on Fly, but it isn't part of that guide.

app = "rmap-frontend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.frontend"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
