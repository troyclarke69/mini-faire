# Fly.io deployment manifest (PHASE7-DEPLOYMENT.md Section 1) for the
# backend service. Fly deploys one app per fly.toml; the frontend gets its
# own (infra/cloud/fly.frontend.toml) since Fly apps are single-image, one
# per manifest - not something one file can express for two images.
#
# Deploy with `fly deploy --config infra/cloud/fly.toml --dockerfile
# infra/cloud/Dockerfile.backend` from the repo root. Secrets (JWT_SECRET_KEY,
# MONGO_PASSWORD, POSTGRES_PASSWORD, SLACK_WEBHOOK_URL, CORS_ALLOWED_ORIGINS)
# are set via `fly secrets set NAME=value`, never committed here - same
# posture every config/*.yaml in this repo already takes. See DEPLOYMENT.md
# for the full step-by-step (volume creation, secrets, seeding demo data).
#
# App name is "rmap-backend" (the product's brand name - see DEPLOYMENT.md's
# naming note) even though the repository/package underneath is still named
# mini-faire; Fly app names are globally unique across all Fly customers, so
# rename this if "rmap-backend" is already taken by someone else.
#
# Not deployed/validated against a real Fly.io account from the sandbox
# that authored this file (no Fly API token / account there).

app = "rmap-backend"
primary_region = "iad"

[build]
  dockerfile = "infra/cloud/Dockerfile.backend"

[env]
  MINI_FAIRE_DATA_DIR = "/app/data"

[[mounts]]
  # Fly Volumes are single-node, not multi-writer - matches DuckDB's own
  # single-writer constraint (ingestion/duckdb_utils.py's docstring), so
  # this only works with exactly one backend machine unless
  # config/database.yaml's postgres/mongo backends take over
  # metadata/events (see database/cloud_db.py's module docstring).
  source = "rmap_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
