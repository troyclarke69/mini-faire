[project]
name = "mini-faire"
version = "0.1.0"
description = "Retail marketplace analytics platform demo using DuckDB, Polars, JSONSchema, and Prefect/Airflow examples."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0.0",
  "fastapi>=0.111.0",
  "jsonschema>=4.22.0",
  "polars>=1.0.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
orchestration = [
  "prefect>=2.19.0",
  "apache-airflow>=2.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "compute*", "ingestion*", "orchestration*"]
